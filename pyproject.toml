[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gradeflow-rulegen"
dynamic = ["version"]
description = "Provider-neutral deterministic grading-rule synthesis for GradeFlow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradeflow-engine==0.1.0",
    "litellm>=1.103,<2",
    "openai>=2.20,<3",
    "pydantic~=2.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18",
    "pytest>=9.0",
    "python-dotenv>=1,<2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rulegen*"]

[tool.setuptools.package-data]
"rulegen.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "-m", "not live_soc"]
markers = [
    "live_soc: opt-in test that calls the configured SoC LAAS endpoint",
]

[tool.coverage.run]
source = ["rulegen"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = ["../engine"]
follow_imports = "silent"
